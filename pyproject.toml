[project]
name = "mcp-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "cryptography>=44",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    # FastMCP 4 and the MCP SDK use httpx2 internally; tests reuse it so the
    # ASGI transport types match what the MCP transport expects.
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]